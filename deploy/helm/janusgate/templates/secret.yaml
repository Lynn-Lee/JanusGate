{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "janusgate.secretName" . }}
  labels:
    {{- include "janusgate.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ required "secret.secretKey is required unless secret.existingSecret is set" .Values.secret.secretKey | quote }}
  JWT_ALGORITHM: {{ .Values.secret.jwtAlgorithm | quote }}
  ACCESS_TOKEN_EXPIRE_MINUTES: {{ .Values.secret.accessTokenExpireMinutes | quote }}
  REFRESH_TOKEN_EXPIRE_DAYS: {{ .Values.secret.refreshTokenExpireDays | quote }}
{{- end }}
