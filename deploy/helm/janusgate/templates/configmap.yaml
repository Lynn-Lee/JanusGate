apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "janusgate.fullname" . }}-config
  labels:
    {{- include "janusgate.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.config.appEnv | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
  REDIS_MODE: {{ .Values.config.redisMode | quote }}
  REDIS_SENTINEL_URLS: {{ .Values.config.redisSentinelUrls | quote }}
  REDIS_SENTINEL_MASTER_NAME: {{ .Values.config.redisSentinelMasterName | quote }}
  REDIS_CLUSTER_URLS: {{ .Values.config.redisClusterUrls | quote }}
  REDIS_SOCKET_TIMEOUT_SECONDS: {{ .Values.config.redisSocketTimeoutSeconds | quote }}
  SESSION_CONNECTION_TOKEN_STORE: {{ .Values.config.sessionConnectionTokenStore | quote }}
  SESSION_CONNECTION_TOKEN_REDIS_KEY_PREFIX: {{ .Values.config.sessionConnectionTokenRedisKeyPrefix | quote }}
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  RATE_LIMIT_LOGIN_PER_MINUTE: {{ .Values.config.rateLimitLoginPerMinute | quote }}
  RATE_LIMIT_GLOBAL_PER_MINUTE: {{ .Values.config.rateLimitGlobalPerMinute | quote }}
