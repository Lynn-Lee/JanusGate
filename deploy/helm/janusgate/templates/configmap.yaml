apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "janusgate.fullname" . }}-config
  labels:
    {{- include "janusgate.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.config.appEnv | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  RATE_LIMIT_LOGIN_PER_MINUTE: {{ .Values.config.rateLimitLoginPerMinute | quote }}
  RATE_LIMIT_GLOBAL_PER_MINUTE: {{ .Values.config.rateLimitGlobalPerMinute | quote }}
