name: JanusGate CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: janusgate-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  backend-quality:
    name: Backend quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend with dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Mypy typecheck
        run: mypy app

      - name: Pytest
        env:
          SECRET_KEY: ci-secret-key-ci-secret-key-ci-secret-key-32
          DATABASE_URL: postgresql+asyncpg://janusgate:janusgate@localhost:5432/janusgate
          REDIS_URL: redis://localhost:6379/0
        run: pytest

      - name: Bandit security scan
        run: bandit -q -r app

      - name: pip-audit dependency scan
        run: pip-audit --skip-editable

  frontend-quality:
    name: Frontend quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Vitest
        run: npm test -- --run

      - name: Production build
        run: npm run build

  docker-image:
    name: Docker image build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [backend-quality, frontend-quality]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lynn-lee/janusgate-backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Login to GHCR for release tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-smoke:
    name: Phase 3 deploy smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [backend-quality, frontend-quality]
    env:
      POSTGRES_PASSWORD: janusgate-ci-postgres
      SECRET_KEY: ci-secret-key-ci-secret-key-ci-secret-key-32
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write CI Compose env file
        run: |
          {
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
            echo "SECRET_KEY=${SECRET_KEY}"
          } > .env

      - name: Validate Docker Compose config
        run: docker compose config

  helm-lint:
    name: Helm chart lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Lint JanusGate chart
        run: helm lint deploy/helm/janusgate

      - name: Render JanusGate chart
        run: helm template janusgate deploy/helm/janusgate
