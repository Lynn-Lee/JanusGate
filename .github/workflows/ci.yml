name: JanusGate CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: janusgate-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  backend-quality:
    name: Backend quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend with dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate docs OpenAPI export
        run: cd .. && scripts/export-openapi-json.sh docs/site/openapi.json

      - name: Validate docs site static package
        run: cd .. && scripts/build-docs-site.sh dist/docs-site

      - name: Ruff lint
        run: ruff check .

      - name: Mypy typecheck
        run: mypy app

      - name: Pytest
        env:
          SECRET_KEY: ci-secret-key-ci-secret-key-ci-secret-key-32
          DATABASE_URL: postgresql+asyncpg://janusgate:janusgate@localhost:5432/janusgate
          REDIS_URL: redis://localhost:6379/0
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: Bandit security scan
        run: bandit -q -r app

      - name: pip-audit dependency scan
        run: pip-audit --skip-editable

  frontend-quality:
    name: Frontend quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Vitest
        run: npm test -- --run

      - name: Production build
        run: npm run build

  supply-chain-security:
    name: Phase 5 supply-chain security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate supply-chain security workflow wiring
        run: scripts/phase5-supply-chain-security-smoke.sh

      - name: Validate runtime monitoring and hardening wiring
        run: scripts/phase5-runtime-monitoring-smoke.sh

      - name: Trivy high/critical vulnerability gate
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  docker-image:
    name: Docker image build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [backend-quality, frontend-quality, supply-chain-security]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lynn-lee/janusgate-backend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Login to GHCR for release tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate release image SBOM
        if: startsWith(github.ref, 'refs/tags/v')
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/lynn-lee/janusgate-backend@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: janusgate-backend.spdx.json
          artifact-name: janusgate-backend-sbom

      - name: Install Cosign
        if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@v4.1.0

      - name: Sign release image digest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: cosign sign --yes ghcr.io/lynn-lee/janusgate-backend@${{ steps.build.outputs.digest }}

  deploy-smoke:
    name: Phase 3 deploy smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [backend-quality, frontend-quality]
    env:
      POSTGRES_PASSWORD: janusgate-ci-postgres
      SECRET_KEY: ci-secret-key-ci-secret-key-ci-secret-key-32
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write CI Compose env file
        run: |
          {
            echo "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
            echo "SECRET_KEY=${SECRET_KEY}"
          } > .env

      - name: Validate Docker Compose config
        run: docker compose config

      - name: Run Phase 3 Compose health smoke
        run: scripts/phase3-compose-health-smoke.sh

  helm-lint:
    name: Helm chart lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.15.4

      - name: Lint JanusGate chart
        run: helm lint deploy/helm/janusgate

      - name: Render JanusGate chart
        run: helm template janusgate deploy/helm/janusgate

      - name: Phase 5 HA config smoke
        run: scripts/phase5-ha-config-smoke.sh

      - name: Phase 5 capacity model smoke
        run: scripts/phase5-capacity-model-smoke.sh

      - name: Phase 5 release readiness smoke
        run: scripts/phase5-release-readiness-smoke.sh

      - name: Phase 5 Kubernetes multi-replica smoke
        if: vars.JANUSGATE_RUN_K8S_SMOKE == '1'
        env:
          SECRET_KEY: ${{ secrets.JANUSGATE_SMOKE_SECRET_KEY }}
          DATABASE_URL: ${{ secrets.JANUSGATE_SMOKE_DATABASE_URL }}
          DATABASE_READ_REPLICA_URL: ${{ secrets.JANUSGATE_SMOKE_DATABASE_READ_REPLICA_URL }}
          REDIS_URL: ${{ secrets.JANUSGATE_SMOKE_REDIS_URL }}
          JANUSGATE_IMAGE_TAG: ${{ github.sha }}
        run: scripts/phase5-k8s-multi-replica-smoke.sh
