# JanusGate Alembic 配置。
# 数据库连接串由 alembic/env.py 从应用 Settings.DATABASE_URL 读取，
# 因此此处 sqlalchemy.url 留空；离线生成/自检可用 `-x db_url=...` 覆盖。
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# 迁移文件名带 UTC 时间戳前缀，保证顺序可读。
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
