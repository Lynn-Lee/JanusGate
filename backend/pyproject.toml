[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "janusgate-backend"
version = "0.1.0"
description = "JanusGate — 策略驱动的 PAM / 零信任访问网关"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyjwt[crypto]>=2.9.0",
    "bcrypt>=4.2.0",
    "argon2-cffi>=23.1.0",
    "cryptography>=43.0.0",
    "pyotp>=2.9.0",
    "redis[hiredis]>=5.2.0",
    "celery>=5.4.0",
    "httpx>=0.28.0",
    "asyncssh>=2.18.0",
    "python-multipart>=0.0.12",
    "python-dotenv>=1.0.1",
    "python-ldap>=3.4.4",
    "azure-identity>=1.18.0",
    "openai>=1.60.0",
    "structlog>=24.4.0",
    "jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.28.0",
    "factory-boy>=3.3.0",
    "mypy>=1.13.0",
    "ruff>=0.7.0",
    "pre-commit>=4.0.0",
    "bandit>=1.7.0",
    "pip-audit>=2.7.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "T20"]
ignore = ["E501", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.hatch.build.targets.wheel]
packages = ["app"]
